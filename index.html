    <div style="display:flex; flex-direction:column; gap:10px;">
      <div>
        <label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:4px;">ชื่อเอกสาร</label>
        <input id="fName" type="text" placeholder="เช่น คู่มือคุณภาพ (Quality Manual)" style="width:100%;" />
      </div>
      <div>

        <select id="fClause" style="width:100%;"></select>
      </div>
      <div>
        <label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:4px;">ลิงก์ SharePoint</label>
        <input id="fLink" type="text" placeholder="https://yourtenant.sharepoint.com/..." style="width:100%;" />
      </div>
      <div>
        <label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:4px;">สถานะเอกสาร</label>
        <select id="fNote" style="width:100%;">

          <option value="แจกจ่าย">แจกจ่าย</option>
          <option value="สนับสนุน">สนับสนุน</option>
          <option value="ยกเลิก">ยกเลิก</option>

        </select>
      </div>
      <div id="formError" style="font-size:13px; color:var(--text-danger); display:none;"></div>
      <div style="display:flex; gap:8px; margin-top:4px;">
        <button id="saveBtn">บันทึก</button>
        <button id="cancelBtn">ยกเลิก</button>
      </div>
    </div>
  </div>

  <div id="list"></div>
  <div id="empty" style="display:none; text-align:center; padding:2rem 0; color:var(--text-muted); font-size:14px;">ยังไม่มีเอกสาร กด "เพิ่มเอกสาร" เพื่อเริ่มต้น</div>

function groupOf(code) {
  if (!code) return '';
  if (code === '5') return '5';
  return code.split('.')[0];
}
function groupColor(code) {
  const g = groupOf(code);
  const f = GROUPS.find(x => x[0] === g);
  return f ? f[2] : 'c-gray';
}
function groupLabel(code) {
  const g = groupOf(code);
  const f = GROUPS.find(x => x[0] === g);
  return f ? f[1] : 'ไม่ระบุหมวด';
}

function classifyByName(name) {
  if (!name) return '';
  const n = name.toLowerCase();
  let best = ''; let bestScore = 0;
  CLASSIFY_RULES.forEach(([code, keywords]) => {
    let score = 0;
    keywords.forEach(k => { if (n.includes(k.toLowerCase())) score++; });
    if (score > bestScore) { bestScore = score; best = code; }
  });
  return best;

let docs = [];
let editingId = null;
let activeGroup = '';
const STORAGE_KEY = 'iso17025-docs';

function clauseLabel(code) {
  const f = CLAUSES.find(c => c[0] === code);
  return f ? f[1] : code;
}

function fillSelect(sel, includeAll) {
  sel.innerHTML = '';
  if (includeAll) {
    const o = document.createElement('option');
    o.value = ''; o.textContent = 'ทุกข้อกำหนด';
    sel.appendChild(o);
  }
  CLAUSES.forEach(([code, label]) => {
    const o = document.createElement('option');
    o.value = code; o.textContent = label;
    sel.appendChild(o);
  });
}

async function load() {
  try {
    const snap = await getDoc(docRef);
    if (snap.exists() && Array.isArray(snap.data().docs)) {
      docs = snap.data().docs;
    } else {
      docs = SEED_DATA.map(d => ({...d}));
      await persist();
    }
  } catch (e) {
    console.error('load failed', e);
    document.getElementById('list').innerHTML =
      '<p style="color:var(--text-danger); font-size:14px;">โหลดข้อมูลจาก Firebase ไม่สำเร็จ ตรวจสอบ firebaseConfig และ Firestore rules ในไฟล์นี้</p>';
    docs = [];
  }
  render();
}

async function persist() {
  try {
    await setDoc(docRef, { docs, updatedAt: Date.now() });
  } catch (e) {
    console.error('save failed', e);
    alert('บันทึกไป Firebase ไม่สำเร็จ: ' + e.message);
  }
}

function renderChips() {
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.textContent = 'ทั้งหมด';
  allChip.style.cssText = chipStyle(activeGroup === '');
  allChip.onclick = () => { activeGroup = ''; render(); };
  chips.appendChild(allChip);

  GROUPS.forEach(([code, label, ramp]) => {
    const count = docs.filter(d => groupOf(d.clause) === code).length;
    const chip = document.createElement('button');
    chip.innerHTML = `<span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${GROUP_HEX[ramp]}; margin-right:6px; vertical-align:1px;"></span>${label} (${count})`;
    chip.style.cssText = chipStyle(activeGroup === code);
    chip.onclick = () => { activeGroup = activeGroup === code ? '' : code; render(); };
    chips.appendChild(chip);
  });

  const unc = docs.filter(d => !d.clause).length;
  if (unc > 0) {
    const chip = document.createElement('button');
    chip.textContent = `ยังไม่จัดหมวด (${unc})`;
    chip.style.cssText = chipStyle(activeGroup === 'none');
    chip.onclick = () => { activeGroup = activeGroup === 'none' ? '' : 'none'; render(); };
    chips.appendChild(chip);
  }
}

function chipStyle(active) {
  return `white-space:nowrap; flex-shrink:0; font-size:13px; padding:6px 12px; border-radius:999px; border:0.5px solid ${active ? 'var(--border-accent)' : 'var(--border)'}; background:${active ? 'var(--bg-accent)' : 'var(--surface-2)'}; color:${active ? 'var(--text-accent)' : 'var(--text-primary)'}; cursor:pointer;`;
}

function render() {
  renderChips();

  const search = document.getElementById('search').value.trim().toLowerCase();
  const filterClause = document.getElementById('filterClause').value;

  const filtered = docs.filter(d => {
    if (filterClause && d.clause !== filterClause) return false;
    if (activeGroup === 'none' && d.clause) return false;
    if (activeGroup && activeGroup !== 'none' && groupOf(d.clause) !== activeGroup) return false;
    if (search && !d.name.toLowerCase().includes(search)) return false;
    return true;
  });

  const stats = document.getElementById('stats');
  const usedClauses = new Set(docs.map(d => d.clause).filter(Boolean)).size;
  const pct = docs.length ? Math.round((docs.filter(d=>d.clause).length / docs.length) * 100) : 0;
  stats.innerHTML = `
    <div style="background:var(--surface-1); border-radius:var(--radius); padding:1rem;">
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 4px;">เอกสารทั้งหมด</p>
      <p style="font-size:24px; font-weight:500; margin:0;">${docs.length}</p>
    </div>
    <div style="background:var(--surface-1); border-radius:var(--radius); padding:1rem;">
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 4px;">ข้อกำหนดที่มีเอกสารแล้ว</p>
      <p style="font-size:24px; font-weight:500; margin:0;">${usedClauses} / ${CLAUSES.length}</p>
    </div>
    <div style="background:var(--surface-1); border-radius:var(--radius); padding:1rem;">
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 4px;">จัดหมวดแล้ว</p>
      <p style="font-size:24px; font-weight:500; margin:0;">${pct}%</p>
    </div>
  `;

  const progressBar = document.getElementById('progressBar');
  progressBar.innerHTML = '';
  GROUPS.forEach(([code, label, ramp]) => {
    const count = docs.filter(d => groupOf(d.clause) === code).length;
    if (count === 0) return;
    const seg = document.createElement('div');
    seg.style.cssText = `flex:${count}; background:${GROUP_HEX[ramp]};`;
    seg.title = `${label}: ${count}`;
    progressBar.appendChild(seg);
  });
  const uncCount = docs.filter(d => !d.clause).length;
  if (uncCount > 0) {
    const seg = document.createElement('div');
    seg.style.cssText = `flex:${uncCount}; background:var(--border-strong);`;
    seg.title = `ยังไม่จัดหมวด: ${uncCount}`;
    progressBar.appendChild(seg);
  }

  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';

  if (docs.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const grouped = {};
  filtered.forEach(d => {
    const key = d.clause || '__none__';
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(d);
  });

  const clauseOrder = CLAUSES.map(c => c[0]).filter(c => grouped[c]);
  if (grouped['__none__']) clauseOrder.push('__none__');

  if (clauseOrder.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:14px; padding:2rem 0;">ไม่พบเอกสารที่ตรงกับเงื่อนไข</p>';
    return;
  }

  clauseOrder.forEach(code => {
    const ramp = code === '__none__' ? 'c-gray' : groupColor(code);
    
    const section = document.createElement('div');
    section.style.marginBottom = '1.5rem';

    const header = document.createElement('div');
    header.style.cssText = 'display:flex; align-items:center; gap:8px; margin:0 0 10px;';
    const dot = document.createElement('span');
    dot.style.cssText = `width:10px; height:10px; border-radius:50%; background:${GROUP_HEX[ramp]}; flex-shrink:0;`;
    const titleEl = document.createElement('p');
    titleEl.style.cssText = 'font-size:14px; font-weight:500; margin:0;';
    titleEl.textContent = (code === '__none__' ? 'ยังไม่จัดหมวด' : clauseLabel(code)) + ` (${grouped[code].length})`;
    header.appendChild(dot);
    header.appendChild(titleEl);
    section.appendChild(header);

    const cardsWrap = document.createElement('div');
    cardsWrap.style.cssText = 'display:flex; flex-direction:column; gap:8px;';

    grouped[code].forEach(d => {
      const card = document.createElement('div');
      card.style.cssText = `background:var(--surface-1); border:0.5px solid var(--border-strong); border-left:3px solid ${GROUP_HEX[ramp]}; border-radius:var(--radius); padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px;`;

      const left = document.createElement('div');
      left.style.cssText = 'flex:1; min-width:0;';

      const topRow = document.createElement('div');
      topRow.style.cssText = 'display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:2px;';
      const nameEl = document.createElement('span');
      nameEl.style.cssText = 'font-size:14px; word-break:break-word;';
      nameEl.textContent = d.name;
      topRow.appendChild(nameEl);
      if (d.note && STATUS_STYLE[d.note]) {
        const st = STATUS_STYLE[d.note];
        const badge = document.createElement('span');
        badge.textContent = d.note;
        badge.style.cssText = `font-size:11px; padding:1px 8px; border-radius:999px; background:${st.bg}; color:${st.text}; flex-shrink:0;`;
        topRow.appendChild(badge);
      }
      left.appendChild(topRow);

      if (d.link) {
        const linkEl = document.createElement('a');
        linkEl.href = d.link;
        linkEl.style.cssText = 'font-size:13px; color:var(--text-accent); text-decoration:none;';
        linkEl.textContent = 'เปิดใน SharePoint →';
        left.appendChild(linkEl);
      } else {
        const noLink = document.createElement('span');
        noLink.style.cssText = 'font-size:12px; color:var(--text-muted);';
        noLink.textContent = 'ยังไม่มีลิงก์';
        left.appendChild(noLink);
      }

      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex; gap:4px; flex-shrink:0; align-self:center;';
      const editBtn = document.createElement('button');
      editBtn.textContent = 'แก้ไข';
      editBtn.setAttribute('aria-label', 'แก้ไข');
      editBtn.style.cssText = 'padding:6px 10px; font-size:13px;';
      editBtn.onclick = () => openEdit(d.id);
      const delBtn = document.createElement('button');
      delBtn.textContent = 'ลบ';
      delBtn.setAttribute('aria-label', 'ลบ');
      delBtn.style.cssText = 'padding:6px 10px; font-size:13px; color:var(--text-danger);';
      delBtn.onclick = () => removeDoc(d.id);
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      card.appendChild(left);
      card.appendChild(actions);
      cardsWrap.appendChild(card);
    });
    section.appendChild(cardsWrap);
    list.appendChild(section);
  });
}

function openAdd() {
  editingId = null;
  document.getElementById('formTitle').textContent = 'เพิ่มเอกสารใหม่';
  document.getElementById('fName').value = '';
  document.getElementById('fLink').value = '';
  document.getElementById('fNote').value = 'ควบคุม';
  document.getElementById('fClause').value = '';
  document.getElementById('autoHint').textContent = '';
  document.getElementById('formError').style.display = 'none';
  document.getElementById('formCard').style.display = 'block';
}

function openEdit(id) {
  const d = docs.find(x => x.id === id);
  if (!d) return;
  editingId = id;
  document.getElementById('formTitle').textContent = 'แก้ไขเอกสาร';
  document.getElementById('fName').value = d.name;
  document.getElementById('fLink').value = d.link || '';
  document.getElementById('fNote').value = d.note || 'ควบคุม';
  document.getElementById('fClause').value = d.clause;
  document.getElementById('autoHint').textContent = '';
  document.getElementById('formError').style.display = 'none';
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('formCard').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function closeForm() {
  document.getElementById('formCard').style.display = 'none';
  editingId = null;
}

async function saveDoc() {
  const name = document.getElementById('fName').value.trim();
  const clause = document.getElementById('fClause').value;
  const link = document.getElementById('fLink').value.trim();
  const note = document.getElementById('fNote').value;
  const errEl = document.getElementById('formError');

  if (!name) {
    errEl.textContent = 'กรอกชื่อเอกสารก่อน';
    errEl.style.display = 'block';
    return;
  }
  if (!clause) {
    errEl.textContent = 'ระบบแยกหมวดให้ไม่ได้ กรุณาเลือกข้อกำหนดเอง';
    errEl.style.display = 'block';
    return;
  }

  if (editingId) {
    const d = docs.find(x => x.id === editingId);
    d.name = name; d.clause = clause; d.link = link; d.note = note;
  } else {
    docs.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,7), name, clause, link, note });
  }
  await persist();
  closeForm();
  render();
}

async function removeDoc(id) {
  docs = docs.filter(d => d.id !== id);
  await persist();
  render();
}

fillSelect(document.getElementById('filterClause'), true);
fillSelect(document.getElementById('fClause'), true);

document.getElementById('addBtn').onclick = openAdd;
document.getElementById('cancelBtn').onclick = closeForm;
document.getElementById('saveBtn').onclick = saveDoc;
document.getElementById('search').oninput = render;
document.getElementById('filterClause').onchange = render;

document.getElementById('fName').oninput = () => {
  if (editingId) return;
  const name = document.getElementById('fName').value;
  const guess = classifyByName(name);
  const hint = document.getElementById('autoHint');
  const sel = document.getElementById('fClause');
  if (guess) {
    sel.value = guess;
    hint.textContent = '(จัดหมวดอัตโนมัติ)';
  } else {
    hint.textContent = name ? '(ไม่พบคำที่ตรง เลือกเอง)' : '';
  }
};

load();


</script>
</body>
</html>
